<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card-stat { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-stat .icon { font-size: 2rem; opacity: 0.3; }
    .card-stat h3 { font-size: 1.8rem; font-weight: 700; margin: 0; }
    .card-stat small { color: #6c757d; font-size: 0.85rem; }
    .table-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .fila-venta { cursor: pointer; }
    .fila-venta:hover { background-color: #f1f5ff; }
  </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">
      <i class="bi bi-controller"></i> Cyber Productos
    </span>
    <div>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <span class="text-white">
                <i class="bi bi-person-circle"></i> Admin
            </span>
        </div>
  </nav>

  <!-- contenido -->
   <div class="container-fluid py-4 px-4">
        <div class="card table-card p-3">
            <div class=" d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0"><i class="bi bi-box-seam"></i> Productos</h4>
                <button id="btn-nuevo" class="btn btn-primary">
                    <i class="bi bi-plus-circle"> Nuevo Producto</i>
                </button>
            </div>
            <table class=" table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Categoria</th>
                        <th>Precio</th>
                        <th>stock</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos">
                    <tr>
                        <td colspan="7" class="text-center text-muted">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
   </div>

   <div class="modal fade" id="modalProducto" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title" id="modal-titulo">Nuevo producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <form id="formProducto">
            <div class="modal-body">

              <input type="hidden" name="id_producto" id="input-id">

              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre_producto" id="input-nombre"
                       class="form-control" required maxlength="150">
              </div>

              <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select name="id_categoria" id="input-categoria"
                        class="form-select" required>
                  <option value="">Cargando...</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Precio (Bs.)</label>
                <input type="number" name="precio" id="input-precio"
                       class="form-control" required step="0.01" min="0">
              </div>

            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Guardar
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/productos.js"></script>
</body>
</html>
