<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Cyber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .login-card h3 { text-align: center; margin-bottom: 1.5rem; }
    .icon-login { font-size: 3rem; color: #2a5298; display: block; text-align: center; margin-bottom: 1rem; }
  </style>
</head>
<body>

  <div class="login-card">
    <i class="bi bi-controller icon-login"></i>
    <h3>Cyber Sistema</h3>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div id="error-msg" class="alert alert-danger d-none"></div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorBox = document.getElementById('error-msg');
      errorBox.classList.add('d-none');

      const fd = new FormData(form);
      const res = await fetch('../api/login.php', { method: 'POST', body: fd });
      const json = await res.json();

      if (!json.ok) {
        errorBox.textContent = json.error;
        errorBox.classList.remove('d-none');
        return;
      }

      // Login OK → redirigir al dashboard
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
